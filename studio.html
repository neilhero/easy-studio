<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  film: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>'),

  shield: svg('<path d="M12 3 4.5 6v5c0 5 3 8 7.5 10 4.5-2 7.5-5 7.5-10V6zM9 12l2 2 4-4"/>'),
  layers: svg('<path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/>'),
  spark: svg('<path d="M12 3c0 5-3 8-8 8 5 0 8 3 8 8 0-5 3-8 8-8-5 0-8-3-8-8zM19 16v5m-2.5-2.5h5"/>'),
  checklist: svg('<path d="m3 6 2 2 3-4M11 6h10M3 12h4m4 0h10M3 18h4m4 0h10"/>'),
  panel: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  play: svg('<path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/>'),
  pause: svg('<path d="M8 5v14M16 5v14" stroke-width="2.5"/>'),
  prev: svg('<path d="M6 6v12"/><path d="M18 6 10 12l8 6z" fill="currentColor"/>'),   /* |◀ 上一帧 */
  next: svg('<path d="M18 6v12"/><path d="M6 6l8 6-8 6z" fill="currentColor"/>'),    /* ▶| 下一帧 */
  flag: svg('<path d="M5 21V4h11l-2 4 2 4H5"/>'),
  x: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>'),
  save: svg('<path d="M4 4h12l4 4v12H4z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  left: svg('<path d="m15 6-6 6 6 6"/>'), right: svg('<path d="m9 6 6 6-6 6"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'), sound: svg('<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>'), soundOff: svg('<path d="M4 10v4h4l5 4V6L8 10z"/><path d="m16 9 5 6M21 9l-5 6"/>'),
  full: svg('<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>'), doc: svg('<path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6M9 13h7M9 17h7"/>'),
  expand: svg('<path d="m6 6 6 6-6 6M13 6l6 6-6 6"/>'), collapse: svg('<path d="m18 6-6 6 6 6M11 6l-6 6 6 6"/>'),
  pen: svg('<path d="M4 20h4L18 10l-4-4L4 16z"/><path d="m12.5 7.5 4 4"/>'), minus: svg('<path d="M5 12h14"/>'), plus: svg('<path d="M12 5v14M5 12h14"/>'), refresh: svg('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>'),
};
const navIcons = {watch:'film',progress:'table',library:'grid',drawerBtn:'panel',navToggle:'expand',theme:'moon',
  mobileTheme:'moon',navMore:'more',qualityBtn:'shield',tasksBtn:'checklist',generationBtn:'spark',finishingBtn:'pen',
  episodeBtn:'film',automationBtn:'layers'};
$('.brand-mark').innerHTML = ICON.play;
$$('.nav .i').forEach(button => { button.querySelector('.ic').innerHTML = ICON[navIcons[button.dataset.view || button.id]]; });
const mobileNav = matchMedia('(max-width:720px)');
const navMore = $('#navMore'), navTools = $('#navTools');
function setMore(open) {
  navTools.classList.toggle('is-open',open);
  navMore.setAttribute('aria-expanded',String(open));
}
navMore.addEventListener('click',()=>setMore(navMore.getAttribute('aria-expanded')!=='true'));
navTools.addEventListener('click',event=>{ if (mobileNav.matches && event.target.closest('button')) setMore(false); });
document.addEventListener('pointerdown',event=>{
  if (!navTools.contains(event.target) && !navMore.contains(event.target)) setMore(false);
});
navMore.closest('nav').addEventListener('keydown',event=>{
  if (event.key==='Escape' && navMore.getAttribute('aria-expanded')==='true') {
    setMore(false);
    navMore.focus();
  }
});
mobileNav.addEventListener('change',()=>setMore(false));

const S = { view: 'watch', proj: null, finals: { videos: [], docs: [] }, cur: null, cmp: { mode: 'off', alt: null, offset: 0, audio: 'cur', blinkOn: false }, markers: [], draft: null,
  auxTab: 'marks', fbPath: '反馈/待处理.md', editing: null, segs: null, selSeg: null, lib: null, selLib: null, libCat: '全部', doc: null, docPath: null, lb: null };
const TL = { data: null, pps: 0, fit: 0, max: 120, z: 0, open: true, sel: null, scale: 0, lastW: 0, ensure: false };   // 时间线：z 是相对整条的放大倍数
const api = async (url, opt) => { const r = await fetch(url, opt); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const post = (url, body) => api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const fmt = t => { t = Math.max(0, +t || 0); const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; };
const parseTc = s => { const m = /^(\d+):(\d+(?:\.\d+)?)$/.exec(s); return m ? +m[1] * 60 + +m[2] : null; };
const short = n => n.replace(/\.[^.]+$/, '');
const fileUrl = p => '/f/' + p.split('/').map(encodeURIComponent).join('/');

/* markdown：标题、分隔线、表格、列表、引用、代码、段落；够读自审就行 */

    const l = lines[i]; let m;
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre>' + esc(buf.join('\n')) + '</pre>'); continue; }

    if (/^\s*[-*]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, '')); out.push('<ul>' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { const items = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+[.)]\s+/, '')); out.push('<ol>' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*>/.test(l)) { const b = []; while (i < lines.length && /^\s*>/.test(lines[i])) b.push(lines[i++].replace(/^\s*>\s?/, '')); out.push('<blockquote>' + inline(b.join(' ')) + '</blockquote>'); continue; }

    out.push('<p>' + inline(p.join(' ')) + '</p>');

}
function linkTimecodes(el, isDoc) {
  const D = dur() || shown()?.duration || 0; const found = [];

  for (const n of nodes) {
    if (n.parentNode.closest('pre, a, button')) continue;
    const text = n.nodeValue; if (!re.test(text)) { re.lastIndex = 0; continue; } re.lastIndex = 0;

    while ((m = re.exec(text))) {
      const t = +m[1] * 60 + +m[2] + (m[3] ? +('0.' + m[3]) : 0);
      if (D && t > D + 1) continue;
      frag.append(text.slice(last, m.index));
      frag.append(h('button', { class: 'tcl', type: 'button', title: '跳到这里', onclick: () => { seek(t); $('#video').pause(); } }, m[0]));
      found.push(t); last = m.index + m[0].length;

function showAutoPacket(p){

  if(p.reference_images?.length)dialog.append(h('div',{class:'reference-list'},...p.reference_images.map(r=>h('div',{},h('img',{src:fileUrl(r.path),style:'width:100%;max-height:120px;object-fit:contain',alt:r.name}),h('p',{class:'xs t3'},r.id+' · '+r.name+' v'+r.version)))));
  const grid=h('div',{class:'reference-list'},...p.frames.map(f=>h('div',{},h('img',{src:fileUrl(f.path),style:'width:100%',alt:f.id}),h('p',{class:'xs t3'},f.id+' · '+fmt(f.t)))));dialog.append(grid);

$('#finishingBtn').addEventListener('click', () => openFinishing());

function finishingSource(snapshot) {
  if (snapshot.source === 'final') return 'Studio 初剪 · ' + snapshot.final.split('/').pop();
  if (snapshot.source === 'draft') return 'Studio 工作草稿 · 修订 ' + snapshot.revision;
  return '项目剪辑表';
}

async function openFinishing(draftId) {
  const dialog = h('dialog', {class:'review-dialog', 'aria-label':'剪映精修'});
  const content = h('div');
  const steps = h('ol', {class:'handoff-steps','aria-label':'剪映交接步骤'});
  const feedback = h('p', {class:'s t3', role:'status'});
  const button = (label, onclick, extra={}) => h('button', {class:'pill sm', type:'button', onclick, ...extra}, label);
  const field = (label, control) => h('label', {}, label, control);
  let selection = 'current';
  let selectedDraft = draftId;
  let setupOpen;
  let busy = false;
  let refreshRequest = 0;

  function showStep(current) {
    const labels = ['确认来源', '建草稿', '到剪映精修并导出', '回收复查'];
    steps.replaceChildren(...labels.map((label, index)=>h('li', {class:'s',
      'aria-current':current === index + 1 ? 'step' : null}, (index + 1) + ' · ' + label)));
  }
  showStep(1);

  async function act(action, data) {
    if (busy) return;
    busy = true;
    content.inert = true;
    feedback.textContent = '正在处理…';
    try {
      const result = await post('/api/finishing/' + action, data);
      if (action === 'create' || action === 'revise') {
        selectedDraft = result.id;
        setupOpen = false;
      }
      feedback.textContent = ({create:'草稿已准备',revise:'已保存新修订',publish:'已注册，打开剪映项目列表即可看到',receive:'已回收，请开始技术质检',scan:'技术质检已开始，请稍后刷新',review:'已记录成片复查'})[action];
      await refresh();
    } catch (error) {
      feedback.textContent = error.message;
      if (action === 'publish') await refresh().catch(() => {});
    } finally {
      busy = false;
      content.inert = false;
    }
  }

  async function refresh() {
    const requestId = ++refreshRequest;
    const state = await api('/api/finishing');
    if (requestId !== refreshRequest || !dialog.open) return;
    const record = state.items.find(item=>item.id===selectedDraft) || state.items[0];
    selectedDraft = record?.id;
    const source = h('select', {'aria-label':'初剪来源'});
    const choices = [['current','正在剪的版本'],['draft','已保存的初剪草稿'],['legacy','项目剪辑表'],
      ...state.finals.map(final=>[final, '初剪成片 · ' + final.split('/').pop()])];
    for (const [value, label] of choices) source.append(h('option', {value}, label));

    function drawRecord(record) {
      const parent = state.items.find(item=>item.id===record.parent_id);

      if (record.status === 'published') {

      }
      card.append(h('details',{},h('summary',{},'草稿包位置'), h('p',{class:'s path wrap'},record.package)));
      if (state.configured && ['prepared','published'].includes(record.status)) {

        const volume = h('input',{type:'number',min:0,max:400,step:1,'aria-label':'音量百分比'});

        card.append(h('details',{},h('summary',{},'新建字幕或音量修订'),

          h('div',{class:'form-grid surface'},field('片段',media),field('音量 %',volume),

            }
            if (caption.value.trim()) operations.push({op:'append',clip:{id:'t'+requestId,kind:'text',track:'字幕',

            if (!operations.length) {feedback.textContent='请先填写字幕或调整音量。';return;}
            act('revise',{id:record.id,request_id:requestId,operations});

        const confirmed = h('input',{type:'checkbox'});
        const receive = button('回收为新成片',()=>act('receive',{id:record.id,source:input.value.trim(),confirm_export:confirmed.checked}),
          {class:'pill primary',disabled:true});
        const allowReceive = () => {receive.disabled = !input.value.trim() || !confirmed.checked;};
        input.addEventListener('input',allowReceive);
        confirmed.addEventListener('change',allowReceive);
        const fields = h('div',{},
          h('p',{class:'s t3'},'导出结束后填写文件路径，回收为这份草稿的成片。'),
          input,h('p',{class:'s'},h('label',{},confirmed,' 已确认这份影片从上方剪映草稿导出')),receive,
          h('details',{},h('summary',{},'可用导入目录'),h('p',{class:'s t3 wrap'},state.import_roots.join(' · '))));
        review.append(record.outputs.length ? h('details',{},h('summary',{},'回收另一份导出'),fields) : fields);
      } else {
        review.append(h('p',{class:'s t3'},'请先完成剪映导出。'));
      }
      for (const film of record.outputs) {
        const last = film.reviews.at(-1);
        const report = film.scan;
        const reviewText = film.stale ? '文件内容已变化' : last ? (last.status==='approved' ? '全片通过' : '退回精修') : '待全片复查';
        const statusText = report ? ({running:'检查中',completed:'解码通过',failed:'检测失败',interrupted:'检测中断'})[report.status] : '待技术质检';
        const section = h('section',{class:'quality-section'},
          h('h3',{class:'wrap'},'回收版 · ' + film.source_name),
          h('p',{class:'s wrap'},reviewText + ' · ' + film.at),
          h('p',{class:'s t3'},`${film.metadata.width}×${film.metadata.height} · ${fmt(film.metadata.duration)} · ${statusText} · 按全片时间码复查`),
          h('a',{href:fileUrl(film.final),target:'_blank',rel:'noopener',class:'pill sm'},'播放回收版'));
        if (report?.events.length) section.append(h('ul',{class:'s'},...report.events.map(e=>h('li',{},e.type+' · '+fmt(e.t)))));
        if (report?.error) section.append(h('p',{class:'s'},report.error));
        if (!film.stale && report?.status !== 'running') section.append(button(report ? '重新技术质检' : '开始技术质检',
          ()=>act('scan',{final:film.final}),{class:report?.status === 'completed' ? 'pill sm' : 'pill primary'}));
        if (report?.status === 'running') section.append(h('p',{class:'s t3'},'质检结束后，点「刷新状态」查看结果。'));
        if (!film.stale && report?.status === 'completed') {
          const note = h('textarea',{class:'review-note',rows:2,placeholder:'看完后记录画面、字幕、声音或需返修的时间码','aria-label':'全片复查结论'});
          const decision = status=>act('review',{final:film.final,film_hash:film.film_hash,scan_id:report.id,status,note:note.value});
          section.append(note,h('div',{class:'review-actions'},button('全片通过',()=>decision('approved')),button('退回精修',()=>decision('rejected'))));
        }
        if (last) section.append(h('p',{class:'s'},last.note));
        review.append(section);
      }
      draft.replaceChildren(card,review);
    }
    if (record) {
      const version = h('select',{'aria-label':'剪映草稿版本'},...state.items.map(item=>h('option',{value:item.id},
        item.name + ' · ' + item.at)));
      version.value = selectedDraft;
      version.onchange = () => {
        selectedDraft = version.value;
        setup.open = false;
        drawRecord(state.items.find(item=>item.id===selectedDraft));
      };
      versions.append(h('label',{class:'handoff-version s'},'剪映草稿版本',version),draft);
      drawRecord(record);
    }
    content.replaceChildren(setup,versions);
    let wasOpen = setup.open;
    setup.addEventListener('toggle',()=>{
      if (!setup.isConnected || wasOpen === setup.open) return;
      wasOpen = setupOpen = setup.open;
      if (setup.open) preview();
      else if (record) showStep(draftStep(state.items.find(item=>item.id===selectedDraft)));
      else showStep(1);
    });
    if (setup.open) await preview();
  }
  dialog.append(h('div',{class:'review-actions'},h('b',{},'剪映精修'),
    button('刷新状态',async()=>{if (!busy) try {await refresh();}catch(error){feedback.textContent=error.message;}}),
    button('关闭',()=>dialog.close())),steps,feedback,content);
  dialog.addEventListener('close',()=>dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
  try {await refresh();} catch(error) {feedback.textContent=error.message;}
}

function taskState(kind, status, job) {
  const cycle = job.cycles?.at(-1);
  if (status === 'waiting_review') {
    if (kind === 'episode' && cycle?.rough && job.deliver === 'rough' && job.acceptance === 'director') {
      return {label:'等待你验收', stage:'初剪已复查', next:'请完整看一遍初剪，再填写验收结论。', director:true};
    }
    const phases = {candidates:'候选审查',final_review:'接缝与全片复查',inspection_review:'当前剪辑复查'};
    return {label:'等待智能体看片', stage:phases[job.phase] || '审片与复查', next:'请让已连接 Easy Studio 的智能体领取审查包，看片并回填结果。'};
  }
  if (status === 'waiting_host' || (status === 'queued' && kind === 'generation' && job.provider === 'libtv')) {
    if (kind === 'episode' && cycle?.handoff) {
      return {label:'等待剪映导出或回收确认', stage:'剪映草稿已准备',
        next:'请在「剪映精修」发布草稿、导出并回收成片，完成复查；多版通过时，再选交付版。', jianying:true};
    }
    return {label:'等待智能体处理', stage:job.stage, next:'请让已连接相关平台的智能体继续处理这条原任务。'};
  }
  if (kind === 'generation' && status === 'succeeded' && job.review_status === 'pending') {
    return {label:'等待你审看候选', stage:'返修候选已回收', next:'请在「单镜返修」看片并填写判断。'};
  }
  const states = {
    queued:['排队','系统会在有空位后继续。'],
    running:['执行中','由系统继续处理。'],
    needs_reconciliation:['待核对原任务', '请先核对原任务回执，确认状态后再继续。'],
    needs_decision:['需要你处理','请查看当前问题，再决定修改或续做。'],
    paused:['已暂停','准备好后可续跑原任务。'],
    interrupted:['已中断','请查看上次进度，再从原工作台继续。'],
    failed:['失败','请查看失败原因，再从原工作台处理。'],
    cancelled:['已取消','任务已停止。'],
    completed:['已完成','可查看输出或报告。'],
    succeeded:['执行完成','可查看输出或报告。']
  };
  const [label, next] = states[status] || ['状态待核对','请打开对应工作台查看。'];
  return {label, next, stage:job.error || (kind === 'automation' && status === 'succeeded' ? job.content_status : job.stage)};
}

function taskStateLines(state) {
  return [
    state.stage ? h('p',{class:'s wrap'},'当前环节：'+state.stage) : null,
    h('p',{class:'s t3'},'下一步：'+state.next)
  ];
}

function openTaskDetails(container) {
  return new Set($$('details[data-task]',container).filter(d=>d.open).map(d=>d.dataset.task));
}

$('#episodeBtn').addEventListener('click', async () => {
  const dialog = h('dialog',{class:'review-dialog','aria-label':'整集制作'});
  const feedback = h('p',{class:'s t3',role:'status'});
  const runs = h('div');
  const button = (label,action,disabled=false)=>h('button',{type:'button',class:'pill sm',onclick:action,disabled},label);
  const select = (label,options)=>h('select',{'aria-label':label},...options.map(([value,name])=>h('option',{value},name)));
  const field = (label,control)=>h('label',{},label,control);
  let busy = false;
  let refreshing = false;
  let signature;

  async function submit(action,args) {
    if (busy) return;
    busy = true;
    feedback.textContent = '正在提交…';
    try {
      await post('/api/episode/'+action,args);
      feedback.textContent = '已登记，请查看制作状态。';
      await refresh(true);
    } catch(error) { feedback.textContent = error.message; }
    finally {busy=false;}
  }
  async function refresh(force=false) {
    if (refreshing || (!force && runs.contains(document.activeElement) && document.activeElement.matches('input,textarea'))) return;
    refreshing = true;
    try {
      const state=await api('/api/episode');
      if (!dialog.open) return;
      const current=JSON.stringify(state.items);
      if (current===signature) return;
      signature=current;
      const expanded=openTaskDetails(runs);
      runs.replaceChildren();
      for (const run of state.items) {
        const c=run.cycles.at(-1);
        const status=taskState('episode',run.status,run);
        const card=h('section',{class:'task-card'},
          h('div',{class:'task-heading'},h('b',{},state.templates[run.template]+' · 第 '+c.number+' 轮'),
            h('span',{class:'badge'},status.label)),
          ...taskStateLines(status));
        const actions=h('div',{class:'review-actions'});
        if (['paused','interrupted','failed','cancelled','needs_decision'].includes(run.status)) actions.append(button('续跑原任务',()=>submit('resume',{id:run.id})));
        if (['paused','interrupted','completed','needs_decision','waiting_review'].includes(run.status)) actions.append(button('按新输入续做',()=>submit('resume',{id:run.id,refresh:true})));
        if (run.final || c.rough) actions.append(h('a',{class:'pill sm',href:fileUrl(run.final || c.rough.path),target:'_blank',rel:'noopener'},run.final?'播放交付片':'播放初剪'));
        if (c.handoff) actions.append(button('打开剪映精修',()=>{dialog.close();openFinishing(c.handoff);}));
        if (run.report) actions.append(h('a',{class:'pill sm',href:'/api/episode/report?'+new URLSearchParams({id:run.id,cycle:c.number}),target:'_blank',rel:'noopener'},'查看当前报告'));
        const reports=h('div',{class:'review-actions'});
        for (const revision of run.cycles) {
          const url='/api/episode/report?'+new URLSearchParams({id:run.id,cycle:revision.number});
          reports.append(h('a',{class:'pill sm',href:url,target:'_blank',rel:'noopener'},(revision.report?.includes('交付报告')?'交付报告':'进度报告')+' v'+revision.number));
        }
        if (run.enabled && run.status!=='interrupted') reports.append(button('暂停派发',()=>submit('pause',{id:run.id})));
        card.append(actions);
        if (status.director) {
          const note=h('textarea',{class:'review-note',rows:2,'aria-label':'制作验收结论',placeholder:'完整看片后填写验收结论'});
          const decide=status=>submit('decide',{id:run.id,path:c.rough.path,film_hash:c.rough.film_hash,status,note:note.value});
          card.append(note,h('div',{class:'review-actions'},button('验收通过',()=>decide('approved')),button('退回制作',()=>decide('rejected'))));
        }
        if (status.jianying) {
          const version=h('input',{class:'review-note',type:'text',placeholder:'若有多份通过版，粘贴交付报告中的影片路径'});
          card.append(h('details',{},h('summary',{},'指定已通过的剪映回收版'),version,button('选定交付版',async()=>{
            try {
              const report=await api('/api/episode/report?'+new URLSearchParams({id:run.id}));
              const candidate=report.artifacts.filter(item=>item.kind==='editable_jianying').flatMap(item=>item.outputs).find(item=>item.final===version.value.trim());
              if (!candidate) {feedback.textContent='找不到这份回收版。';return;}
              await submit('decide',{id:run.id,path:candidate.final,film_hash:candidate.film_hash,status:'approved',note:'选定已复查的剪映回收版'});
            } catch(error) {feedback.textContent=error.message;}
          })));
        }
        card.append(h('details',{'data-task':run.id,open:expanded.has(run.id)},h('summary',{},'任务详情与各轮报告'),
          h('p',{class:'xs t3 wrap'},'镜号：'+run.segments.join('、')+' · 上限 '+run.max_credits+' 积分'),
          h('p',{class:'xs t3 wrap'},'任务 ID：'+run.id),reports));
        runs.append(card);
      }
      if (!state.items.length) runs.append(h('p',{class:'s t3'},'暂无制作运行。'));
    } catch(error) { feedback.textContent=error.message; }
    finally { refreshing=false; }
  }

  dialog.append(h('div',{class:'review-actions'},h('b',{},'整集制作'),button('关闭',()=>dialog.close())),feedback);
  document.body.append(dialog);
  dialog.showModal();
  const timer=setInterval(refresh,2200);
  dialog.addEventListener('close',()=>{clearInterval(timer);dialog.remove();});
  try {
    const [state,project] = await Promise.all([api('/api/episode'),api('/api/segments')]);
    if (!dialog.open) return;
    const template=select('制作模板',Object.entries(state.templates).reverse());
    const segments=h('input',{type:'text','aria-label':'镜号范围',value:(project.rows || []).map(row=>row.id).join(', ')});
    const source=select('时间线来源',[['auto','已有时间线优先'],['current','只用当前时间线'],['candidates','从已关联候选重新选片']]);
    const target=select('交付方式',[['rough','Studio 初剪'],['jianying','交给剪映精修']]);
    const repair=h('div',{class:'form-grid surface'});
    const shot=select('返修镜头',(project.rows || []).map(row=>[row.id,row.id+' · '+row.scene]));
    const issue=h('input',{type:'text','aria-label':'本地补帧问题'});
    const preserve=h('input',{type:'text','aria-label':'必须保留的内容'});
    repair.append(field('本地 RIFE 补帧镜头',shot),field('返修问题',issue),field('保留内容',preserve));
    repair.hidden=true;
    const adopt=h('input',{type:'checkbox'});
    const adoptField=h('p',{class:'s'},h('label',{},adopt,' 如须从候选重剪，授权采用已复查初剪为工作草稿'));
    adoptField.hidden=true;
    template.onchange=()=>{
      repair.hidden=adoptField.hidden=template.value!=='repair';
      repair.style.display=repair.hidden?'none':'';
      target.disabled=template.value!=='episode';
    };
    template.onchange();
    const authorized=h('input',{type:'checkbox'});
    const launch=button('授权并开始制作',()=>{
      const id=crypto.randomUUID().replaceAll('-','');
      const repairs=template.value==='repair'?[{segment:shot.value,provider:'rife',issue:issue.value,preserve:preserve.value}]:[];
      submit('start',{request_id:id,template:template.value,segments:segments.value.split(/[,，\s]+/).filter(Boolean),
        source:source.value,deliver:target.disabled?'rough':target.value,authorize:authorized.checked,
        max_credits:0,adopt_rough:adopt.checked,repairs});
    });
    dialog.append(runs,h('details',{class:'task-card',open:!state.items.length},h('summary',{},'开始新的整集制作'),
      h('p',{class:'s t3'},'按填写顺序执行。此页面发起的制作使用零平台积分，支持本地补帧。LibTV 返修及预算可由智能体按授权提交。'),
      h('div',{class:'form-grid surface'},field('模板',template),field('镜号（逗号分隔）',segments),field('来源',source),field('交付',target)),
      repair,adoptField,h('p',{class:'s'},h('label',{},authorized,' 授权所选范围内的制作步骤，平台积分上限为 0')),launch));
    await refresh();

async function compareUpscale(id) {

    const time = h('input',{type:'range',min:'0',max:'1',step:'0.001',value:'0','aria-label':'对照时间',oninput:e=>{players.forEach(v=>{v.pause();v.currentTime=Number(e.target.value);});playing=false;}});
    const pause = () => {playing=false;players.forEach(v=>v.pause());};
    players[0].addEventListener('loadedmetadata',()=>{time.max=String(players[0].duration);});
    players[0].addEventListener('ended',pause);
    timer=setInterval(()=>{if(playing){const [a,b]=players;if(Math.abs(a.currentTime-b.currentTime)>.08)b.currentTime=a.currentTime;time.value=String(a.currentTime);}},100);
    dialog.append(h('div',{class:'review-actions'},h('b',{},'原片 / 超分 · 同步对照'),h('button',{class:'pill sm',onclick:()=>dialog.close()},'关闭')),

      h('label',{},h('input',{type:'checkbox',onchange:e=>players[1].muted=!e.target.checked}),'试听超分原声')),time);

function tlSelect(type, i) { const it = type === 'V' ? TL.data.V[i] : TL.data.A[i]; TL.sel = { type, i }; tlMarkSel(); $('#video').pause(); seek(it.start + 0.02); S.auxTab = 'shot'; renderAuxWatch(); openAux(); }
function tlSetPps(p, tAnchor, xScreen) {
  const sc = $('#tlScroll'); if (!sc || !TL.data?.found) return; p = Math.min(TL.max, Math.max(TL.fit, p));
  const lane = $('#tlRuler');
  if (xScreen == null) { const cur = lane.offsetLeft + (tAnchor || 0) * TL.pps - sc.scrollLeft; xScreen = (cur >= 0 && cur <= sc.clientWidth) ? cur : sc.clientWidth / 2; }
  TL.pps = p; TL.z = p / TL.fit; tlSavePrefs(); tlDraw();
  sc.scrollLeft = Math.max(0, $('#tlRuler').offsetLeft + (tAnchor || 0) * p - xScreen);
  const sl = $('#tlZoom'); if (sl) sl.value = tlSliderVal(); const w = $('#tlWin'); if (w) w.textContent = tlWindowText();
}
function tlZoom(f) { if (!TL.data?.found || !TL.open) return; tlSetPps(TL.pps * f, $('#video')?.currentTime || 0); }
function tlWheel(e) {
  const sc = $('#tlScroll'); if (!sc || !TL.data?.found || !TL.open) return;
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); const r = $('#tlRuler').getBoundingClientRect(); const t = Math.max(0, (e.clientX - r.left) / TL.pps); tlSetPps(TL.pps * Math.pow(1.0025, -e.deltaY), t, e.clientX - sc.getBoundingClientRect().left); return; }
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && sc.scrollWidth > sc.clientWidth) { e.preventDefault(); sc.scrollLeft += e.deltaY; }
}
function tlAuxHead() {
  const d = TL.data, sel = TL.sel;
  if (!d?.found || !sel) return ['这一镜', shown()?.version || ''];
  if (sel.type === 'V') { const c = d.V[sel.i]; return [`第 ${sel.i + 1} 镜 · ${c.id}`, `${fmt(c.start)}–${fmt(c.start + c.dur)}`]; }
  const x = d.A[sel.i]; return [`${KIND[x.kind] || x.kind} · ${x.name}`, `${fmt(x.start)} · ${x.dur.toFixed(1)}s`];
}
function renderShotTab(a) {
  const d = TL.data;
  if (!d?.found) { a.append(h('div', { class: 'empty', style: 'padding:32px 8px' }, h('div', { class: 'h' }, '还没有剪辑表'), h('p', {}, '剪辑技能写出 剪辑/剪辑表.py 之后，这里显示播放头所在那一镜来自哪段素材、声音怎么落。'))); return; }
  const sel = TL.sel;
  if (!sel) { a.append(h('p', { class: 's t3' }, '播放头走到哪一镜，这里就显示哪一镜；点时间线上的块也行。')); return; }
  if (sel.type === 'V') {
    const c = d.V[sel.i], end = c.start + c.dur, film = TL.film;
    if (c.kind === 'live') a.append(c.exists ? h('video', { class: 'srcv', src: fileUrl(c.src) + `#t=${c.in},${c.out}`, controls: true, preload: 'none', muted: !c.a, title: '只播这一镜用的那一段' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '源文件不在这个项目里 · ', h('span', { class: 'path' }, c.src))));
    else if (c.kind === 'image') a.append(c.exists ? h('img', { class: 'srcv', src: fileUrl(c.src), alt: c.id, style: 'object-fit:contain' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '图不在这个项目里 · ', h('span', { class: 'path' }, c.src))));
    else a.append(h('div', { class: 'notice' }, h('div', { class: 'b' }, c.kind === 'title' ? '片名卡：' + c.id : c.kind === 'black' ? '黑场' : '白场')));
    a.append(h('dl', { class: 'kv', style: 'margin-top:12px' },
      kv('来源', c.kind === 'live' || c.kind === 'image' ? h('span', { class: 'path' }, c.src) : null),
      kv('入点 / 出点', c.kind === 'live' ? `${c.in} → ${c.out}（${c.dur.toFixed(2)} 秒${c.freeze ? '，含定格 ' + c.freeze : ''}）` : `${c.dur.toFixed(2)} 秒`),
      kv('调色', `${c.grade || '默认'}${c.matte === false ? ' · 不走 LOOK' : ''}`),
      kv('原声', c.kind === 'live' ? (c.a ? `${c.a}` : '不要') : null),
      kv('淡入 / 淡出', (c.fi || c.fo) ? `${c.fi || 0} / ${c.fo || 0} 秒` : null)));
    if (c.kind === 'live') a.append(h('div', { style: 'margin-top:12px' }, h('button', { class: 'pill sm', type: 'button', title: '到进度页看这一段参考了什么、提示词、候选', onclick: () => openSegmentFor(c, film) }, '看这一段的生成记录')));
    const over = d.A.filter(x => x.start < end && x.start + x.dur > c.start);
    if (over.length) a.append(h('div', { class: 'aux-sec' }, h('div', { class: 'k' }, `这一镜里的声音 · ${over.length}`), ...over.map(x => h('div', { class: 'srow' }, h('span', { class: 'badge neutral' }, KIND[x.kind] || x.kind), h('button', { class: 'link ellipsis', type: 'button', style: 'min-width:0;text-align:left', onclick: () => tlSelect('A', x.i) }, x.name), h('span', { class: 'mono t3' }, `${fmt(x.start)} · ${x.gain} dB`)))));
  } else {
    const x = d.A[sel.i];
    a.append(x.exists ? h('audio', { src: fileUrl(x.src), controls: true, preload: 'none', style: 'width:100%' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '声音文件不在这个项目里 · ', h('span', { class: 'path' }, x.src))));
    a.append(h('dl', { class: 'kv', style: 'margin-top:12px' },
      kv('来源', h('span', { class: 'path' }, x.src)),
      kv('落点', `${fmt(x.start)}，长 ${x.dur.toFixed(1)} 秒${x.loop ? '，循环' : ''}${x.in ? '，源入点 ' + x.in : ''}`),
      kv('电平', `${x.gain} dB${x.norm != null ? '，先归一到 ' + x.norm : ''}${x.duck ? '，对白时让路' : ''}`),
      kv('淡入 / 淡出', (x.fi || x.fo) ? `${x.fi || 0} / ${x.fo || 0} 秒` : null),
      kv('处理', [x.fx, x.raw ? '不柔化' : '', x.clarity ? '对白链' : ''].filter(Boolean).join(' · ') || null),
      kv('包络', x.env.length ? x.env.map(e => `${fmt(e[0])} ${e[1] > 0 ? '+' : ''}${e[1]} dB`).join('，') : null),
      kv('落点（多次）', x.hits.length ? x.hits.map(fmt).join('，') : null)));
  }
}

/* ---------- 灯箱 */
function openLightbox(list, idx) {
  S.lb = { list, idx }; const lb = $('#lightbox'); lb.innerHTML = ''; lb.hidden = false;
  const x = list[idx];
  lb.append(h('button', { class: 'x', type: 'button', 'aria-label': '关闭', html: ICON.x, onclick: closeLightbox }));
  if (list.length > 1) { lb.append(h('button', { class: 'nav-l', type: 'button', 'aria-label': '上一张', html: ICON.left, onclick: e => { e.stopPropagation(); openLightbox(list, (idx - 1 + list.length) % list.length); } })); lb.append(h('button', { class: 'nav-r', type: 'button', 'aria-label': '下一张', html: ICON.right, onclick: e => { e.stopPropagation(); openLightbox(list, (idx + 1) % list.length); } })); }
  lb.append(h('img', { class: 'img', src: fileUrl(x.path), alt: x.name, onclick: e => e.stopPropagation() }));
  lb.append(h('div', { class: 'cap' }, `${x.lab ? x.lab + ' · ' : ''}${x.path}${list.length > 1 ? `  ${idx + 1} / ${list.length}` : ''}`));
  lb.onclick = closeLightbox;
  $('.x', lb).focus();
}
function closeLightbox() { const lb = $('#lightbox'); lb.hidden = true; lb.innerHTML = ''; S.lb = null; }

/* ---------- 键盘 */
document.addEventListener('keydown', e => {
  if (document.querySelector('.review-dialog[open]')) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (S.lb) { if (e.key === 'Escape') closeLightbox(); else if (e.key === 'ArrowLeft') $('#lightbox .nav-l')?.click(); else if (e.key === 'ArrowRight') $('#lightbox .nav-r')?.click(); return; }
  if (e.key === 'Escape') { if (S.draft) cancelDraft(); else closeAux(); return; }
  if (typing) { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'draftNote') { e.preventDefault(); saveDraft(); } return; }
  if (S.view !== 'watch' || !S.cur) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? seek($('#video').currentTime - 1) : step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? seek($('#video').currentTime + 1) : step(1); }
  else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); mark(); }
  else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); toggleBlink(); }
  else if (e.key === '=' || e.key === '+') { e.preventDefault(); tlZoom(1.5); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); tlZoom(1 / 1.5); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); jumpCut(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); jumpCut(-1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFull(); }
});

/* ---------- 起 */
async function boot() {
  try {
    S.proj = await api('/api/project');
    $('#appVersion').textContent = 'Easy Studio v' + S.proj.version;
    [S.finals, TL.data] = await Promise.all([api('/api/finals'), api('/api/timeline').catch(() => ({ found: false }))]);
    await loadFeedback(); tlLoadPrefs();
  } catch (e) {
    $('#v-watch').innerHTML = `<div class="empty bad"><div class="h">连不上放映室的服务器</div><p>${esc(e.message)}</p></div>`; return;
  }
  renderWatch(); renderAuxWatch(); switchView(['progress', 'library'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'watch'); applyUI();
  setInterval(pollStat, 3000);
  window.__studio = { S, TL, pollStat, live: () => LIVE };   // 给自测脚本看内部状态用
}
boot();
})();
</script>
